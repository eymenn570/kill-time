<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>KILL TIME</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">

    <section id="lobby">
      <img
        class="menu-image"
        src="https://i.ibb.co/Q77sXPVc/1000030605.png"
        alt="KILL TIME">

      <h1>KILL TIME</h1>
      <p class="subtitle">YUNIX AMONG · ONLINE</p>

      <input
        id="playerName"
        maxlength="16"
        placeholder="Oyuncu adın">

      <button id="createButton">ODA OLUŞTUR</button>

      <div class="join-area">
        <input
          id="roomCode"
          maxlength="5"
          placeholder="ODA KODU">
        <button id="joinButton">KATIL</button>
      </div>

      <div id="status">Sunucuya bağlanılıyor...</div>

      <section id="roomPanel" hidden>
        <h2>ODA: <span id="roomCodeText"></span></h2>
        <p>Oyuncular:</p>
        <ul id="playerList"></ul>
        <button id="startButton" hidden>OYUNU BAŞLAT</button>
        <p id="waitingText">Oyun sahibi bekleniyor...</p>
      </section>
    </section>

    <section id="gamePanel" hidden>
      <h2>KILL TIME</h2>
      <p id="roleText">Rolün yükleniyor...</p>
      <canvas id="gameCanvas" width="900" height="520"></canvas>
      <p class="help">Hareket: WASD veya yön tuşları</p>
    </section>

  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
