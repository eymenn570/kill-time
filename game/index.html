
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KILL TIME</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="menu">
    <h1>KILL TIME</h1>
    <p>WHO IS THE IMPOSTOR?</p>
    <button id="start">OYUNA BAŞLA</button>
    <small>YUNIX AMONG • v0.1</small>
  </div>

  <div id="game" class="hidden">
    <header>
      <b>KILL TIME</b>
      <span id="role">MÜRETTEBAT</span>
      <span id="tasks">0/5 GÖREV</span>
    </header>

    <canvas id="world" width="800" height="600"></canvas>

    <div class="actions">
      <button id="task">GÖREV</button>
      <button id="meeting">TOPLANTI</button>
    </div>

    <div class="controls">
      <button data-key="up">▲</button>
      <button data-key="left">◀</button>
      <button data-key="down">▼</button>
      <button data-key="right">▶</button>
    </div>

    <p id="message">Uzay gemisine hoş geldin!</p>
  </div>

  <script src="game.js"></script>
</body>
      </html>
