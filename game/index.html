<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>KILL TIME</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">

    <section id="lobby">
      <img
        class="menu-image"
        src="https://i.ibb.co/Q77sXPVc/1000030605.png"
        alt="KILL TIME">

      <h1>KILL TIME</h1>
      <p class="subtitle">YUNIX AMONG · ONLINE</p>

      <input
        id="playerName"
        maxlength="16"
        placeholder="Oyuncu adın">

      <button id="createButton">ODA OLUŞTUR</button>

      
<div class="menu-buttons">
  <a href="/pages/create/" class="menu-button">
    🚀 PARTİ OLUŞTUR
  </a>

  <a href="/pages/join/" class="menu-button">
    🎮 PARTİYE KATIL
  </a>
</div>
    

    <section id="gamePanel" hidden>
      <h2>KILL TIME</h2>
      <p id="roleText">Rolün yükleniyor...</p>
      <canvas id="gameCanvas" width="900" height="520"></canvas>
      <p class="help">Hareket: WASD veya yön tuşları</p>
    </section>

  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
