
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KILL TIME</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

  <div id="menu">
    <h1>KILL TIME</h1>
    <p>WHO IS THE IMPOSTOR?</p>

    <img
      class="menu-image"
      src="https://i.ibb.co/Q77sXPVc/1000030605.png"
      alt="KILL TIME Menü Görseli"
    >

    <button id="start">OYUNA BAŞLA</button>
    <small>YUNIX AMONG • v0.3</small>
  </div>

  <div id="game" class="hidden">
    <header>
      <b>KILL TIME</b>
      <span id="role">MÜRETTEBAT</span>
      <span id="tasks">0/5 GÖREV</span>
    </header>

    <canvas id="world" width="800" height="600"></canvas>

    <div class="actions">
      <button id="task">GÖREV / TAMİR</button>
      <button id="meeting">TOPLANTI</button>
    </div>

    <div class="controls">
      <button data-key="up">▲</button>
      <button data-key="left">◀</button>
      <button data-key="down">▼</button>
      <button data-key="right">▶</button>
    </div>

    <p id="message">Uzay gemisine hoş geldin!</p>
  </div>

  <script src="game.js?v=2"></script>
</body>
</html>
